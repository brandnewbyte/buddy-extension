<!-- SPA login with no name, id or placeholder on either field: the visible
     <label> is the only evidence there is. -->
<div class="auth">
  <label for="f1">Username</label>
  <input type="text" id="f1" data-expect="username">
  <label>Password<input type="text" data-expect="password"></label>
  <button>Sign in</button>
</div>
