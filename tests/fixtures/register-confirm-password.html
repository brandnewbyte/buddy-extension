<!-- Registration alone on the page. Unanchored fill refuses registration
     forms outright; the expectations here apply to an anchored fill (user
     focused the email field and picked an entry — data-anchor marks that).
     The confirm field legitimately receives the same password (data-expect-echo). -->
<form action="/signup">
  <input type="email" name="email" data-expect="username" data-anchor>
  <input type="password" name="new_password" autocomplete="new-password" data-expect="password">
  <input type="password" name="confirm" autocomplete="new-password" data-expect-echo>
  <button>Create account</button>
</form>
