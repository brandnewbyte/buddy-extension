<!-- x.com's search box, attributes verbatim. Nothing on this page is
     fillable: the picker must stay shut rather than cover the site's own
     typeahead dropdown. -->
<header>
  <input autocapitalize="sentences" autocomplete="off" autocorrect="off" placeholder="Search"
         spellcheck="false" enterkeyhint="search" type="text" dir="auto" aria-label="Search query"
         aria-autocomplete="list" role="combobox" aria-expanded="true"
         class="r-30o5oe r-1dz5y72 r-1niwhzg r-17gur6a r-1yadl64 r-deolkf"
         data-testid="SearchBox_Search_Input" data-decoy data-no-picker>
</header>
<main>
  <input type="number" name="qty" value="1" data-decoy data-no-picker>
  <input type="text" name="comment_author" placeholder="Your name" data-decoy data-no-picker>
</main>
